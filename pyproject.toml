[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omnitrace"
version = "0.2.0"
description = "Hierarchical Autonomous Navigation: Classical Global Planning with Local RL Policy to Resolve the Freezing Robot Problem."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pygame>=2.6.0",
    "numpy>=2.0.0",
    "pytest>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:langsmith"
